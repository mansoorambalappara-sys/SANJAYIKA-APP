    <script src="https://cdn.tailwindcss.com"></script>

        body {
            font-family: 'Anek Malayalam', sans-serif;
            background: linear-gradient(135deg, #4a044e 0%, #701a75 50%, #86198f 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        /* Animated Golden Glowing Stroke Card for Admin Login */
        @keyframes goldenGlow {
            0% {
                box-shadow: 0 0 15px rgba(234, 179, 8, 0.5), inset 0 0 10px rgba(234, 179, 8, 0.2);
                border-color: rgba(234, 179, 8, 0.7);
            }
            50% {
                box-shadow: 0 0 35px rgba(250, 204, 21, 0.95), inset 0 0 20px rgba(250, 204, 21, 0.5);
                border-color: rgba(250, 204, 21, 1);
            }
            100% {
                box-shadow: 0 0 15px rgba(234, 179, 8, 0.5), inset 0 0 10px rgba(234, 179, 8, 0.2);
                border-color: rgba(234, 179, 8, 0.7);
            }
        }
        .golden-glow-card {
            border: 3px solid #eab308;
            animation: goldenGlow 3s infinite ease-in-out;
        }

        /* Premium Curved Rectangle Action Buttons with 3D Shadow and Dark Magenta theme */
        .curved-action-btn {
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 1.25rem 1.5rem;
            text-align: left;
            transition: all 0.25s ease-in-out;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            width: 100%;
        }
        .curved-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .curved-action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 3D Malayalam Typography Effect */
        .title-3d {
            font-size: 2.75rem;
            font-weight: 800;
            color: #701a75;
            text-shadow: 
                0 1px 0 #fbcfe8,
                0 2px 0 #f472b6,
                0 3px 0 #db2777,
                0 4px 0 #be185d,
                0 5px 0 #9d174d,
                0 6px 1px rgba(0,0,0,0.1),
                0 0 5px rgba(0,0,0,0.1),
                0 1px 3px rgba(0,0,0,0.3),
                0 3px 5px rgba(0,0,0,0.2),
                0 5px 10px rgba(0,0,0,0.25);
            letter-spacing: -0.025em;
        }

        @media print {
            body {
                background: white !important;
            }
            .no-print {
                display: none !important;
            }
            .glass-card {
                background: white !important;
                box-shadow: none !important;
                border: none !important;
            }
            .print-block {
                display: block !important;
            }
        }

        async function syncToGoogleSheet(payload) {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Google Sheet Sync Error:", err);
            }

            const box = document.getElementById('modal-box');

            document.getElementById('modal-message').innerText = message;

                iconDiv.className = 'w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4';
                iconDiv.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';

            const totalWith = stuWithdrawals.reduce((acc, curr) => acc + curr.amount, 0);
            const balance = totalColl - totalWith;

            let colList = stuCollections.map(c => `<li class="flex justify-between text-xs py-1.5 border-b"><span class="text-slate-600">${c.date}</span><span class="font-bold text-emerald-600">+₹${c.amount}</span></li>`).join('') || '<p class="text-xs text-slate-500">കളക്ഷൻ വിവരങ്ങൾ ലഭ്യമല്ല</p>';

            let witList = stuWithdrawals.map(w => `<li class="flex justify-between text-xs py-1.5 border-b"><span class="text-slate-600">${w.date} (${w.reason})</span><span class="font-bold text-rose-600">-₹${w.amount}</span></li>`).join('') || '<p class="text-xs text-slate-500">പിൻവലിക്കലുകൾ ഒന്നും നടന്നിട്ടില്ല</p>';

            container.innerHTML = `
                <div class="w-full max-w-xl glass-card rounded-3xl p-6 md:p-8 shadow-2xl border border-fuchsia-200">
                    <div class="flex justify-between items-center mb-6 no-print">
                        <div>
                            <h2 class="text-xl font-extrabold text-fuchsia-900">${student.name}</h2>
                            <p class="text-slate-600 text-xs font-medium">${student.classDiv} | പാരന്റ് കോഡ്: ${student.parentCode}</p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="window.print()" class="px-3 py-1.5 bg-fuchsia-800 text-white font-bold text-xs rounded-xl shadow transition">A4 PDF / പ്രിന്റ്</button>
                            <button onclick="logout()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs rounded-xl transition border border-rose-200">ലോഗ്ഔട്ട്</button>
                        </div>
                    </div>

                    <div class="text-center mb-4 hidden print-block">
                        <h2 class="text-xl font-extrabold text-fuchsia-900">സഞ്ചയിക സ്റ്റേറ്റ്മെന്റ് - ${student.name}</h2>
                        <p class="text-xs text-slate-600">ക്ലാസ്സ്: ${student.classDiv} | പാരന്റ് കോഡ്: ${student.parentCode} | Run by: GLP School Mundekkarad</p>
                    </div>

                    <!-- Balance Highlight Card -->
                    <div class="bg-gradient-to-r from-fuchsia-800 to-purple-800 text-white p-6 rounded-2xl shadow-lg mb-6 text-center">
                        <p class="text-xs uppercase tracking-wider text-fuchsia-200 font-bold">അക്കൗണ്ടിലെ ആകെ ബാക്കി തുക</p>
                        <h3 class="text-4xl font-extrabold mt-1">₹${balance}</h3>
                        <div class="flex justify-center space-x-6 mt-4 text-xs font-semibold pt-3 border-t border-fuchsia-700/60">
                            <span>ആകെ അടച്ചത്: ₹${totalColl}</span>
                            <span>ആകെ എടുത്തത്: ₹${totalWith}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white/70 p-4 rounded-2xl border border-slate-200">
                            <h4 class="font-bold text-xs uppercase text-slate-700 mb-2">കളക്ഷൻ ഹിസ്റ്ററി</h4>
                            <ul class="max-h-40 overflow-y-auto pr-1">
                                ${colList}
                            </ul>
                        </div>
                        <div class="bg-white/70 p-4 rounded-2xl border border-slate-200">
                            <h4 class="font-bold text-xs uppercase text-slate-700 mb-2">വിത്ഡ്രോവൽ ഹിസ്റ്ററി</h4>
                            <ul class="max-h-40 overflow-y-auto pr-1">
                                ${witList}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function logout() {
            currentUser = null;
            renderHome();
        }

        window.onload = function() {
            renderHome();
        };
    </script>
</body>
</html>
